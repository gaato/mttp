# nginx for the interop suite: static files, redirects and a reverse proxy
# to the mttp interop server on 127.0.0.1:39000. interop/mttp_client/main.mbt
# lists the URL layout every server shares. Ports: 39010 (http) and 39011
# (https), each on 127.0.0.1 and 127.0.0.2, the second origin of the
# cross-origin redirect.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log off;
    types {
        text/plain txt;
        application/octet-stream bin;
    }
    default_type application/octet-stream;

    # Short, so that the client's idle-close cases need not wait long.
    keepalive_timeout 2s;
    client_max_body_size 64m;

    gzip on;
    gzip_types text/plain;

    upstream mttp {
        server 127.0.0.1:39000;
        # Reused upstream connections: the proxy-reuse cases check them.
        keepalive 8;
    }

    server {
        listen 127.0.0.1:39010;
        listen 127.0.0.2:39010;
        listen 127.0.0.1:39011 ssl;
        listen 127.0.0.2:39011 ssl;
        ssl_certificate /certs/server.pem;
        ssl_certificate_key /certs/server.key;

        root /www;
        # Names the client connection, for the keep-alive cases.
        add_header X-Conn $connection always;

        location / {
        }

        location = /slow.bin {
            limit_rate 4k;
        }

        location /up/ {
            proxy_pass http://mttp/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # Pass bodies on as they arrive, chunked bodies chunked.
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location /limited/ {
            client_max_body_size 1k;
            proxy_pass http://mttp/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location = /r/301 { return 301 /up/echo; }
        location = /r/302 { return 302 /up/echo; }
        location = /r/307 { return 307 /up/echo; }
        location = /r/308 { return 308 /up/echo; }
        location = /same { return 302 /up/headers; }
        location = /xo { return 302 $scheme://127.0.0.2:$server_port/up/headers; }
        location = /down { return 302 http://127.0.0.1:39010/small.txt; }
        location = /s/204 { return 204; }
        # Closes the connection without a response.
        location = /drop { return 444; }
    }
}
