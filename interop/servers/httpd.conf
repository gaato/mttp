# Apache httpd for the interop suite: static files, redirects and a reverse
# proxy (mod_proxy) to the mttp interop server on 127.0.0.1:39000.
# interop/mttp_client/main.mbt lists the URL layout every server shares.
# Ports: 39030 (http) and 39031 (https), each on 127.0.0.1 and 127.0.0.2,
# the second origin of the cross-origin redirect.
ServerRoot "/usr/local/apache2"
ServerName 127.0.0.1
Listen 127.0.0.1:39030
Listen 127.0.0.2:39030
Listen 127.0.0.1:39031 https
Listen 127.0.0.2:39031 https

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule macro_module modules/mod_macro.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule brotli_module modules/mod_brotli.so
LoadModule ratelimit_module modules/mod_ratelimit.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule ssl_module modules/mod_ssl.so

User daemon
Group daemon

# One child process, so that its connection pool to the mttp server is the
# only one: with several, two client connections may land in different
# processes, each with its own connection upstream, and the upstream-reuse
# cases would test the process scheduler instead of the pool.
StartServers 1
ServerLimit 1
ThreadsPerChild 32
MaxRequestWorkers 32
MinSpareThreads 1
MaxSpareThreads 64
ErrorLog /proc/self/fd/2
LogLevel warn
PidFile /tmp/httpd.pid
TypesConfig conf/mime.types
SSLSessionCache "shmcb:/tmp/ssl_scache(512000)"

# Short, so that the client's idle-close cases need not wait long (the
# default is 5 s).
KeepAlive On
KeepAliveTimeout 2
MaxKeepAliveRequests 1000

DocumentRoot /www
<Directory /www>
    Require all granted
</Directory>

<Macro Layout>
    # Names the client connection (by its port), for the keep-alive cases.
    Header always set X-Conn "expr=%{REMOTE_PORT}"

    # Each filter encodes only when the request accepts its coding.
    <Files text.txt>
        SetOutputFilter BROTLI_COMPRESS;DEFLATE
    </Files>
    <Files slow.bin>
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 4
    </Files>

    ProxyPass /up/ http://127.0.0.1:39000/
    # Not proxied, unlike in the other servers: LimitRequestBody does not
    # apply to requests mod_proxy forwards (modules/http/http_filters.c
    # leaves the limit at 0 when r->proxyreq is set). The expect-refused
    # case only needs the 413, which Apache sends from the Content-Length
    # before it reads the body.
    Alias /limited/echo /www/small.txt
    <Location /limited/>
        LimitRequestBody 1024
    </Location>

    Redirect 301 /r/301 /up/echo
    Redirect 302 /r/302 /up/echo
    Redirect 307 /r/307 /up/echo
    Redirect 308 /r/308 /up/echo
    Redirect 302 /same /up/headers
    RewriteEngine On
    RewriteRule ^/xo$ %{REQUEST_SCHEME}://127.0.0.2:%{SERVER_PORT}/up/headers [R=302,L]
    RewriteRule ^/s/204$ - [R=204,L]
</Macro>

<VirtualHost 127.0.0.1:39030 127.0.0.2:39030>
    Use Layout
</VirtualHost>

<VirtualHost 127.0.0.1:39031 127.0.0.2:39031>
    SSLEngine on
    SSLCertificateFile /certs/server.pem
    SSLCertificateKeyFile /certs/server.key
    Redirect 302 /down http://127.0.0.1:39030/small.txt
    Use Layout
</VirtualHost>
