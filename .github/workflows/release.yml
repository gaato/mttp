name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/gaato/moonbit:0.10.17-d971670cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/gates.sh full
      # The release list is empty until a release is explicitly approved.
      - run: scripts/release.sh publish --dry-run
