name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/gaato/moonbit:0.10.17-d971670cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: moon update
      - run: scripts/gates.sh full
      # Validate real package archives without publishing or requiring a
      # registry account. Publication is a separately approved local command.
      - run: moon run scripts/resolver_gate.mbtx
