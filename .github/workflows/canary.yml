name: Toolchain canary

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    container:
      image: ghcr.io/gaato/moonbit:${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The images carry no registry index, and the full gate runs target
      # tests before its static registry refresh (as in ci.yml).
      - name: Update registry index before testing
        run: moon update
      - name: Validate all targets and ledgers
        run: scripts/gates.sh full

  # gaato/mttp_curl on the same toolchains, over Debian's libcurl, which the
  # images lack.
  curl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    container:
      image: ghcr.io/gaato/moonbit:${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: libcurl's headers and library
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - run: moon update
      - name: gaato/mttp_curl's tests, coverage and resolver consumer
        run: scripts/gates.sh curl

  # gaato/mttp_ng on the same toolchains, with its libraries installed as
  # ci.yml's ng job installs them.
  ng:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    container:
      image: ghcr.io/gaato/moonbit:${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nghttp2, nghttp3, ngtcp2 and OpenSSL's headers and libraries, and curl
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libnghttp2-dev libssl-dev curl
          apt-get install -y --no-install-recommends -t trixie-backports libngtcp2-dev libngtcp2-crypto-ossl-dev libnghttp3-dev
      - run: moon update
      - name: gaato/mttp_ng's tests, coverage and resolver consumer
        run: scripts/gates.sh ng

  # gaato/mttp_curl against public HTTP/2 and HTTP/3 servers, on the pinned
  # toolchain; Debian's libcurl is built with HTTP/3. It needs the internet,
  # so push CI does not run it.
  curl-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: libcurl's headers and library
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - run: moon update
      - name: HTTP/2 and HTTP/3 to public servers
        run: scripts/gates.sh curl-live

  # Keep sanitizer overhead out of push CI and use the pinned compiler so
  # findings in our C can be separated from toolchain-canary regressions.
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned moon from the gate image
        run: |
          image="ghcr.io/gaato/moonbit:$(tr + - < moonbit-version)"
          id=$(docker create "$image")
          docker cp "$id:/opt/moon" "$RUNNER_TEMP/moon"
          docker rm "$id"
          echo "MOON_HOME=$RUNNER_TEMP/moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/moon/bin" >> "$GITHUB_PATH"
      # gaato/mttp_curl's tests link the system's libcurl.
      - name: libcurl's headers and library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Run native tests with sanitizers
        env:
          MOON_CC: cc
        run: scripts/gates.sh sanitize

  # Coverage-guided fuzzing of the HTTP/1.1 reader and the WebSocket frame
  # parser (fuzz/, TEST_COVERAGE.md). A short daily run on the pinned moon;
  # a failure leaves the crashing input in _build/fuzz, uploaded below.
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned moon from the gate image
        run: |
          image="ghcr.io/gaato/moonbit:$(tr + - < moonbit-version)"
          id=$(docker create "$image")
          docker cp "$id:/opt/moon" "$RUNNER_TEMP/moon"
          docker rm "$id"
          echo "MOON_HOME=$RUNNER_TEMP/moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/moon/bin" >> "$GITHUB_PATH"
      # The runner's clang links libFuzzer only with Ubuntu's compiler-rt
      # package; install it when the image lacks it.
      - name: Ensure clang can link libFuzzer
        run: |
          printf 'int LLVMFuzzerTestOneInput(const char *d, unsigned long n) { return 0; }\n' > "$RUNNER_TEMP/probe.c"
          if ! clang -fsanitize=fuzzer,address "$RUNNER_TEMP/probe.c" -o "$RUNNER_TEMP/probe"; then
            sudo apt-get update
            sudo apt-get install -y "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          fi
      - name: Fuzz each target for five minutes
        env:
          MOON_CC: cc
        run: scripts/gates.sh fuzz 300
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ github.run_id }}
          path: _build/fuzz
          if-no-files-found: ignore
          retention-days: 30

  # Coverage-guided fuzzing of gaato/mttp_ng (fuzz_ng/, TEST_COVERAGE.md):
  # the HTTP/2 server session, the in-memory HTTP/2 and HTTP/3 pairs, and
  # the module's C stubs, built with libFuzzer and ASan. In the gate image,
  # as the ng job is, for Debian 13's libraries; clang and its libFuzzer
  # runtime come from Debian too. A failure leaves the input in _build/fuzz.
  fuzz-ng:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nghttp2, nghttp3, ngtcp2 and OpenSSL, and clang with libFuzzer
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libnghttp2-dev libssl-dev clang
          apt-get install -y --no-install-recommends -t trixie-backports libngtcp2-dev libngtcp2-crypto-ossl-dev libnghttp3-dev
          apt-get install -y --no-install-recommends "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
      - run: moon update
      - name: Fuzz each target for five minutes
        env:
          MOON_CC: cc
        run: scripts/gates.sh fuzz --gate ng 300
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-ng-artifacts-${{ github.run_id }}
          path: _build/fuzz
          if-no-files-found: ignore
          retention-days: 30

  # gaato/mttp_ng's native tests under ASan, its C stubs instrumented with
  # the generated C, in the gate image with the ng gate's libraries.
  sanitize-ng:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nghttp2, nghttp3, ngtcp2 and OpenSSL, and curl
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libnghttp2-dev libssl-dev curl
          apt-get install -y --no-install-recommends -t trixie-backports libngtcp2-dev libngtcp2-crypto-ossl-dev libnghttp3-dev
      - run: moon update
      - name: Run gaato/mttp_ng's native tests with sanitizers
        env:
          MOON_CC: cc
        run: scripts/gates.sh sanitize --gate ng

  # The interoperability suite (interop/README.md). It runs on the runner
  # itself, not in the gate image: the third-party programs run in
  # containers of their own, and the runner's docker starts them. moon comes
  # out of the gate image of the version moonbit-version pins (its binaries
  # need only glibc 2.18), since this job tests mttp against other
  # implementations, not the toolchain.
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned moon from the gate image
        run: |
          image="ghcr.io/gaato/moonbit:$(tr + - < moonbit-version)"
          id=$(docker create "$image")
          docker cp "$id:/opt/moon" "$RUNNER_TEMP/moon"
          docker rm "$id"
          echo "MOON_HOME=$RUNNER_TEMP/moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/moon/bin" >> "$GITHUB_PATH"
      - name: Update registry index
        run: moon update
      - name: Run the interop suite
        env:
          INTEROP_ENGINE: docker
        run: scripts/gates.sh interop

  # Performance numbers are observations, not pass/fail thresholds: shared
  # runners are noisy. The benchmark itself fails only on a crashed program,
  # a non-200 response, or a body mismatch, then records ratios on one runner.
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned moon from the gate image
        run: |
          image="ghcr.io/gaato/moonbit:$(tr + - < moonbit-version)"
          id=$(docker create "$image")
          docker cp "$id:/opt/moon" "$RUNNER_TEMP/moon"
          docker rm "$id"
          echo "MOON_HOME=$RUNNER_TEMP/moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/moon/bin" >> "$GITHUB_PATH"
      - name: Update registry index
        run: moon update
      - name: Run the transport benchmark
        env:
          BENCH_ENGINE: docker
          MOON_CC: cc
        run: scripts/gates.sh bench --output "$RUNNER_TEMP/transport-benchmark.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload the daily result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: transport-benchmark-${{ github.run_id }}
          path: ${{ runner.temp }}/transport-benchmark.json
          if-no-files-found: error
          retention-days: 30
