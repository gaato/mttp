name: Toolchain canary

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [latest, nightly]
    container:
      image: ghcr.io/gaato/moonbit:${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The images carry no registry index, and the full gate runs target
      # tests before its static registry refresh (as in ci.yml).
      - name: Update registry index before testing
        run: moon update
      # MoonBit after 0.10.20 adds methods to core/async's IO traits that
      # 0.10.20 refuses, and `@io.UnexpectedEof`, which its TLS client
      # raises for a peer that closed without close_notify; mttp's code
      # that needs them cannot sit in the tree yet. compat/core_async_next
      # keeps it at the paths it takes in the tree, with `.next` appended:
      # new files (the impls) and files that replace in-tree versions for
      # 0.10.20, which cannot tell a close without close_notify
      # (incomplete_close.mbt, and the tests of it in socketconn and backend,
      # whose in-tree versions hold as many tests, so the test manifest fits
      # either toolchain). This copies them in on a toolchain that has the
      # methods; both changes are in the same nightlies, so one check serves.
      - name: Adopt core/async's newer IO traits if this toolchain has them
        run: |
          traits="${MOON_HOME:-$HOME/.moon}/lib/core/async/io/pkg.generated.mbti"
          if grep -q 'fn name(Self) -> String' "$traits"; then
            cd compat/core_async_next
            find . -name '*.mbt.next' | while read -r next; do
              cp "$next" "../../${next%.next}"
              echo "adopted ${next%.next}"
            done
          fi
      - name: Validate all targets and ledgers
        run: scripts/gates.sh full

  # The interoperability suite (interop/README.md). It runs on the runner
  # itself, not in the gate image: the third-party programs run in
  # containers of their own, and the runner's docker starts them. moon comes
  # out of the gate image of the version moonbit-version pins (its binaries
  # need only glibc 2.18), since this job tests mttp against other
  # implementations, not the toolchain.
  interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned moon from the gate image
        run: |
          image="ghcr.io/gaato/moonbit:$(tr + - < moonbit-version)"
          id=$(docker create "$image")
          docker cp "$id:/opt/moon" "$RUNNER_TEMP/moon"
          docker rm "$id"
          echo "MOON_HOME=$RUNNER_TEMP/moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/moon/bin" >> "$GITHUB_PATH"
      - name: Update registry index
        run: moon update
      - name: Run the interop suite
        env:
          INTEROP_ENGINE: docker
        run: scripts/gates.sh interop
