name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The parts of `scripts/gates.sh full` run as parallel jobs, so the run takes
# as long as its slowest part instead of the sum of them. `gates` passes only
# when every part passed, so it stays the one result to watch.
jobs:
  tests:
    name: tests (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    strategy:
      fail-fast: false
      matrix:
        target: [native, js, wasm, wasm-gc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: moon update
      - name: Check and test every package on ${{ matrix.target }}
        run: scripts/gates.sh quick --target ${{ matrix.target }}

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Formatting, interfaces, generated sources, docs and ledgers
        run: scripts/gates.sh static

  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: moon update
      - name: The gate script's self-test and the resolver gate
        run: scripts/gates.sh selftest

  workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: moon update
      # npm ci fetches the wrangler that examples/fetch/workers/package-lock.json
      # pins, and the image's Node runs it.
      - name: The Workers example on workerd
        run: scripts/gates.sh workerd

  # gaato/mttp_curl links the system's libcurl, which only the curl jobs
  # install (scripts/modules.tsv puts it in the curl gate; every other job
  # runs the full gate). Debian's libcurl has HTTP/2 and HTTP/3; the canary's
  # curl-live job checks HTTP/3 against public servers.
  curl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: libcurl's headers and library
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - run: moon update
      - name: gaato/mttp_curl's tests, coverage and resolver consumer
        run: scripts/gates.sh curl

  # The same on macOS, over the libcurl that comes with the system (HTTP/2,
  # no HTTP/3), where the backend's notification is a pipe instead of an
  # eventfd. The pinned moon comes from its installer, checked against the
  # upstream checksums as the gate image's Dockerfile checks them.
  curl-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned moon
        run: |
          version=$(cat moonbit-version)
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION="$version" bash
          escaped=$(printf '%s' "$version" | sed 's/+/%2B/g')
          curl -fsSL "https://cli.moonbitlang.com/binaries/$escaped/moonbit-darwin-aarch64.sha256" |
            (cd "$HOME/.moon/bin" && shasum -a 256 -c --quiet -)
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: gaato/mttp_curl's tests, coverage and resolver consumer
        run: scripts/gates.sh curl

  # gaato/mttp_ng links nghttp2, OpenSSL and, for HTTP/3, ngtcp2 with its
  # OpenSSL crypto library and nghttp3, which Debian 13 (the image) has in
  # trixie-backports only (trixie's own ngtcp2 has no OpenSSL crypto
  # library). scripts/modules.tsv puts it in the ng gate; its tests also run
  # Node's node:http2 and curl against its engines.
  ng:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nghttp2, nghttp3, ngtcp2 and OpenSSL's headers and libraries, and curl
        run: |
          echo 'deb http://deb.debian.org/debian trixie-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libnghttp2-dev libssl-dev curl
          apt-get install -y --no-install-recommends -t trixie-backports libngtcp2-dev libngtcp2-crypto-ossl-dev libnghttp3-dev
      - run: moon update
      - name: gaato/mttp_ng's tests, coverage and resolver consumer
        run: scripts/gates.sh ng
      # h2spec 2.6.0 (the latest release), the version mise.toml pins,
      # checked against the digest taken when it was pinned.
      - name: h2spec
        run: |
          curl -fsSL -o /tmp/h2spec.tar.gz https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz
          echo '157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  /tmp/h2spec.tar.gz' | sha256sum -c -
          tar -xzf /tmp/h2spec.tar.gz -C /usr/local/bin h2spec
      - name: h2spec against gaato/mttp_ng's HTTP/2 server
        run: scripts/gates.sh h2spec

  # The same on macOS, over Homebrew's libraries: its libngtcp2 links
  # openssl@4 (keg-only), which build.js finds through pkg-config. The
  # system's curl has no HTTP/3, so Homebrew's comes first on PATH for the
  # test that runs curl against the HTTP/3 server.
  ng-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The pinned moon
        run: |
          version=$(cat moonbit-version)
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | MOONBIT_INSTALL_VERSION="$version" bash
          escaped=$(printf '%s' "$version" | sed 's/+/%2B/g')
          curl -fsSL "https://cli.moonbitlang.com/binaries/$escaped/moonbit-darwin-aarch64.sha256" |
            (cd "$HOME/.moon/bin" && shasum -a 256 -c --quiet -)
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: nghttp2, nghttp3, ngtcp2, OpenSSL and curl from Homebrew
        run: |
          brew install pkg-config libnghttp2 libnghttp3 libngtcp2 openssl@4 curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"
      - run: |
          curl --version
          moon update
      - name: gaato/mttp_ng's tests, coverage and resolver consumer
        run: scripts/gates.sh ng

  # gaato/mttp_ng's HTTP/2 packages on the oldest libraries they claim:
  # Ubuntu 24.04 has nghttp2 1.59 and OpenSSL 3.0, and no ngtcp2 with
  # OpenSSL's QUIC, so the HTTP/3 packages are left out (scripts/gates.sh
  # ng-h2) and must not be needed.
  ng-h2-floor:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned moon from the gate image
        run: |
          image="ghcr.io/gaato/moonbit:$(tr + - < moonbit-version)"
          id=$(docker create "$image")
          docker cp "$id:/opt/moon" "$RUNNER_TEMP/moon"
          docker rm "$id"
          echo "MOON_HOME=$RUNNER_TEMP/moon" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/moon/bin" >> "$GITHUB_PATH"
      - name: nghttp2 and OpenSSL, and no ngtcp2 or nghttp3
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libnghttp2-dev libssl-dev
          ! pkg-config --exists libngtcp2
          pkg-config --modversion libnghttp2 openssl
      - run: moon update
      - name: gaato/mttp_ng's HTTP/2 packages alone
        env:
          MOON_CC: cc
        run: scripts/gates.sh ng-h2

  gates:
    if: always()
    needs: [tests, static, selftest, workerd, curl, curl-macos, ng, ng-macos, ng-h2-floor]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
