name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The parts of `scripts/gates.sh full` run as parallel jobs, so the run takes
# as long as its slowest part instead of the sum of them. `gates` passes only
# when every part passed, so it stays the one result to watch.
jobs:
  tests:
    name: tests (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    strategy:
      fail-fast: false
      matrix:
        target: [native, js, wasm, wasm-gc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: moon update
      - name: Check and test every package on ${{ matrix.target }}
        run: scripts/gates.sh quick --target ${{ matrix.target }}

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Formatting, interfaces, generated sources, docs and ledgers
        run: scripts/gates.sh static

  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: moon update
      - name: The gate script's self-test and the resolver gate
        run: scripts/gates.sh selftest

  workerd:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: moon update
      # npm ci fetches the wrangler that examples/fetch/workers/package-lock.json
      # pins, and the image's Node runs it.
      - name: The Workers example on workerd
        run: scripts/gates.sh workerd

  # gaato/mttp_curl links the system's libcurl, which only this job installs
  # (scripts/modules.tsv puts it in the curl gate; every other job runs the
  # full gate). It is not among the needs of `gates` while the module is a
  # prototype: release.yml waits for the whole CI run, and a libcurl problem
  # must not hold up the release of the other modules. Debian's libcurl has
  # HTTP/2; HTTP/3 is checked by the opt-in curl-live gate instead.
  curl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/gaato/moonbit:0.10.22-124d61d05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: libcurl's headers and library
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - run: moon update
      - name: gaato/mttp_curl's tests, coverage and resolver consumer
        run: scripts/gates.sh curl

  gates:
    if: always()
    needs: [tests, static, selftest, workerd]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
