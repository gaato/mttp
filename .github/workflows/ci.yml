name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/gaato/moonbit:0.10.17-d971670cd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The full gate runs target tests before its static registry refresh.
      - name: Update registry index before testing
        run: moon update
      - name: Validate all targets and ledgers
        run: scripts/gates.sh full
